name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # DATABASE_URL/SHADOW_DATABASE_URL aren't real here - `prisma generate`
      # never opens a connection, but prisma.config.ts reads them eagerly.
      - run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          SHADOW_DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
      # Generates the ambient RouteContext/LayoutProps/PageProps types that
      # `next dev`/`next build` normally produce as a side effect - without
      # this, a fresh checkout has none of them and tsc fails on every typed
      # route/page.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint

  build-and-push:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # The deploy key is locked to a forced command in the server's
      # authorized_keys (command="/var/www/guildmasters/deploy.sh") - whatever
      # we send here is ignored server-side, that script always runs instead.
      # It does: docker compose pull app && up -d && run --rm app prisma
      # migrate deploy && image prune.
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: exit 0
